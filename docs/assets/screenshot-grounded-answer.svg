  <text x="132" y="54" font-family="Menlo, Monaco, Consolas, monospace" font-size="15" fill="#93a4b8">Cursor answer · grounded by ContractMesh</text>
  <g font-family="Menlo, Monaco, Consolas, monospace">
<text x="48" y="112" font-size="15" fill="#d7e3f4">billing-api owns subscription entitlement; inventory-api owns device state.</text>
<text x="48" y="136" font-size="15" fill="#d7e3f4">support-api may combine both contexts for ticket priority, but billing</text>
<text x="48" y="160" font-size="15" fill="#d7e3f4">does not enforce inventory state and inventory does not decide entitlement.</text>
<text x="48" y="184" font-size="15" fill="#d7e3f4"></text>
