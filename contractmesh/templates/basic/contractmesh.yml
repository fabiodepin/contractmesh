name: example-app
mode: basic
workspace_mapping_version: v3
repos:
  - path: .
    name: app
docs:
  contracts:
    - docs/contracts
  adrs:
    - docs/adrs
  gaps:
    - docs/known-gaps.md
lint:
  require_owner: true
  require_ids: true
  require_valid_crosslinks: true
index:
  mode: allowlist
  include:
    - src/**
    - tests/**
    - docs/**
    - README.md
  # Starter allowlist is intentional. Unconventional roots are not indexed
  # automatically — add them when needed, for example:
  #   - app/**
  #   - lib/**
  #   - packages/**
  #   - services/**
  #   - cmd/**
  #   - internal/**
  # Optional exclude on top of allowlist + .contractmeshignore:
  # exclude:
  #   - secrets/**
  # Denylist is available only when deliberately configured.
#
# Debug: contractmesh index --explain PATH
#        contractmesh index --show-policy
