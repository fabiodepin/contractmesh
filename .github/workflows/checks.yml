name: checks

on:
  push:
  pull_request:

jobs:
  contractmesh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[mcp]"
      - name: Release gate
        run: contractmesh check --release
      - name: Self check
        run: contractmesh self check
