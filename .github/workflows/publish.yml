name: publish

# Publishes to PyPI on a GitHub Release. Users then install with:
#   pipx install "contractmesh[mcp]"
#
# One-time setup (after the GitHub repo exists):
#   1. PyPI → Account settings → Publishing → Add a new pending publisher
#   2. Owner: fabiodepin  Project: contractmesh
#      Workflow: publish.yml  Environment: pypi (optional but recommended)
#   3. Create a GitHub Environment named "pypi" (optional protection rules)
#   4. Create a Release tagged vX.Y.Z matching VERSION / pyproject.toml

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Verify version files match the release tag
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          expected="${tag#v}"
          py_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          file_version="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$tag expected=$expected pyproject=$py_version VERSION=$file_version"
          test "$py_version" = "$expected"
          test "$file_version" = "$expected"

      - name: Build
        run: |
          rm -rf dist/ build/
          python -m build
          python -m twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/contractmesh
    permissions:
      id-token: write # Trusted Publishing (OIDC) — no PyPI API token in secrets
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
